<!DOCTYPE html>
<html class="dark" lang="en"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/swiper@8/swiper-bundle.min.css">
  <style>
    /* Same styles as anime.html */
    .anime-continue-slider {
      width: 100%;
      overflow: hidden;
      padding-top: 4px;
      padding-bottom: 8px;
    }
    .anime-continue-slider:not(.swiper-initialized) .swiper-wrapper,
    #animeContinueWatchingGrid:not(.swiper-initialized) {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
      scroll-snap-type: x mandatory;
      padding-left: 2px;
      padding-right: 2px;
    }
    .anime-continue-slider:not(.swiper-initialized) .swiper-wrapper::-webkit-scrollbar,
    #animeContinueWatchingGrid:not(.swiper-initialized)::-webkit-scrollbar {
      display: none;
    }
    .anime-continue-slider .swiper-slide,
    #animeContinueWatchingGrid > div {
      flex-shrink: 0;
      scroll-snap-align: start;
    }
  </style>

<body class="bg-black text-white p-4">
  <div style="width: 390px; border: 1px solid red; margin: 0 auto;">
    <section id="animeContinueWatchingSection" style="display: block;">
      <div class="max-w-7xl mx-auto">
        <div class="flex items-center justify-between mb-2">
          <h2>Continue Transmission</h2>
          <div>
            <button id="animeContinuePrevBtn" class="swiper-button-disabled" disabled="" tabindex="-1" aria-label="Previous slide" aria-controls="animeContinueWatchingGrid" aria-disabled="true">&lt;</button>
            <button id="animeContinueNextBtn" tabindex="0" aria-label="Next slide" aria-controls="animeContinueWatchingGrid" aria-disabled="false">&gt;</button>
          </div>
        </div>

        <div class="relative group/continue">
          <div class="swiper anime-continue-slider overflow-hidden -mx-1 px-1 swiper-initialized swiper-horizontal swiper-pointer-events swiper-watch-progress swiper-backface-hidden">
            <div class="swiper-wrapper flex items-stretch" id="animeContinueWatchingGrid" aria-live="polite" style="cursor: grab;">
      <div class="swiper-slide w-[136px] sm:w-[155px] md:w-[175px] lg:w-[190px] shrink-0 bg-gray-800 rounded-xl overflow-hidden p-2 swiper-slide-visible swiper-slide-active" role="group" aria-label="1 / 5" style="margin-right: 10px;">
        <div class="aspect-[2/3] bg-gray-700 w-full mb-1"></div>
        <div class="text-xs font-bold">Cowboy Bebop</div>
        <div class="text-[10px] text-gray-400">Episode 1</div>
      </div>
    
      <div class="swiper-slide w-[136px] sm:w-[155px] md:w-[175px] lg:w-[190px] shrink-0 bg-gray-800 rounded-xl overflow-hidden p-2 swiper-slide-visible swiper-slide-next" role="group" aria-label="2 / 5" style="margin-right: 10px;">
        <div class="aspect-[2/3] bg-gray-700 w-full mb-1"></div>
        <div class="text-xs font-bold">Magical Girl</div>
        <div class="text-[10px] text-gray-400">Episode 1</div>
      </div>
    
      <div class="swiper-slide w-[136px] sm:w-[155px] md:w-[175px] lg:w-[190px] shrink-0 bg-gray-800 rounded-xl overflow-hidden p-2 swiper-slide-visible" role="group" aria-label="3 / 5" style="margin-right: 10px;">
        <div class="aspect-[2/3] bg-gray-700 w-full mb-1"></div>
        <div class="text-xs font-bold">Overgeared</div>
        <div class="text-[10px] text-gray-400">Episode 1</div>
      </div>
    
      <div class="swiper-slide w-[136px] sm:w-[155px] md:w-[175px] lg:w-[190px] shrink-0 bg-gray-800 rounded-xl overflow-hidden p-2" role="group" aria-label="4 / 5" style="margin-right: 10px;">
        <div class="aspect-[2/3] bg-gray-700 w-full mb-1"></div>
        <div class="text-xs font-bold">Solo Leveling</div>
        <div class="text-[10px] text-gray-400">Episode 1</div>
      </div>
    
      <div class="swiper-slide w-[136px] sm:w-[155px] md:w-[175px] lg:w-[190px] shrink-0 bg-gray-800 rounded-xl overflow-hidden p-2" role="group" aria-label="5 / 5" style="margin-right: 10px;">
        <div class="aspect-[2/3] bg-gray-700 w-full mb-1"></div>
        <div class="text-xs font-bold">Attack on Titan</div>
        <div class="text-[10px] text-gray-400">Episode 1</div>
      </div>
    </div>
          <span class="swiper-notification" aria-live="assertive" aria-atomic="true"></span></div>
        </div>
      </div>
    </section>
  </div>

  <script src="https://unpkg.com/swiper@8/swiper-bundle.min.js"></script>
  <script>
    const list = [
      { lunarId: 1, title: 'Cowboy Bebop', poster: 'Postes/spyfamS3p.jpg', episodeNumber: 1, percent: 1 },
      { lunarId: 2, title: 'Magical Girl', poster: 'Postes/spyfamS3p.jpg', episodeNumber: 1, percent: 50 },
      { lunarId: 3, title: 'Overgeared', poster: 'Postes/spyfamS3p.jpg', episodeNumber: 1, percent: 1 },
      { lunarId: 4, title: 'Solo Leveling', poster: 'Postes/spyfamS3p.jpg', episodeNumber: 1, percent: 20 },
      { lunarId: 5, title: 'Attack on Titan', poster: 'Postes/spyfamS3p.jpg', episodeNumber: 1, percent: 80 }
    ];

    const grid = document.getElementById('animeContinueWatchingGrid');
    grid.innerHTML = list.map(item => `
      <div class="swiper-slide w-[136px] sm:w-[155px] md:w-[175px] lg:w-[190px] shrink-0 bg-gray-800 rounded-xl overflow-hidden p-2">
        <div class="aspect-[2/3] bg-gray-700 w-full mb-1"></div>
        <div class="text-xs font-bold">${item.title}</div>
        <div class="text-[10px] text-gray-400">Episode ${item.episodeNumber}</div>
      </div>
    `).join('');

    let animeContinueSwiper = null;
    function initAnimeContinueSwiper() {
      const sliderEl = document.querySelector('.anime-continue-slider');
      animeContinueSwiper = new Swiper(sliderEl, {
        slidesPerView: 'auto',
        spaceBetween: 10,
        grabCursor: true,
        watchSlidesProgress: true,
        navigation: {
          nextEl: '#animeContinueNextBtn',
          prevEl: '#animeContinuePrevBtn'
        }
      });
      
      console.log('Swiper initialized:', {
        sliderWidth: sliderEl.clientWidth,
        wrapperWidth: document.querySelector('.swiper-wrapper').clientWidth,
        slidesCount: document.querySelectorAll('.swiper-slide').length,
        slide0Width: document.querySelectorAll('.swiper-slide')[0].offsetWidth,
        slide1Width: document.querySelectorAll('.swiper-slide')[1].offsetWidth,
        slide2Width: document.querySelectorAll('.swiper-slide')[2].offsetWidth,
        slide0Left: document.querySelectorAll('.swiper-slide')[0].offsetLeft,
        slide1Left: document.querySelectorAll('.swiper-slide')[1].offsetLeft,
        slide2Left: document.querySelectorAll('.swiper-slide')[2].offsetLeft
      });
    }

    requestAnimationFrame(() => {
      initAnimeContinueSwiper();
    });
  </script>


</body></html>
